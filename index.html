<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lộ trình thăm khám</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#12302b;--mute:#5d7570;--line:#d4dfdb;--main:#0b6b5f;--main-d:#085249;--soft:#e1f0ec;--ok:#2b8a57;--lit:#f59e0b;--litink:#3a2500;--danger:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#0e1917;--card:#15251f;--ink:#e3f0ec;--mute:#8fa8a2;--line:#274039;--main:#2fb5a4;--main-d:#5fd0c2;--soft:#1a342e;--ok:#4ade80;--danger:#f87171}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;overscroll-behavior:none}

/* ---- Bố cục máy tính: cột trái + bản đồ ---- */
.app{display:grid;grid-template-columns:minmax(340px,440px) 1fr;height:100%}
.side{display:flex;flex-direction:column;height:100%;min-height:0;border-right:1px solid var(--line);background:var(--bg)}
.sheetHead{padding:12px 12px 8px}
.grip{display:none}
.sheetBody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 12px calc(40px + env(safe-area-inset-bottom,0))}
.mapwrap{position:relative;min-height:0}
#map{position:absolute;inset:0}
.mapbtns{position:absolute;right:10px;bottom:var(--mb,16px);z-index:500;display:flex;flex-direction:column;gap:8px}
.mini{display:none}

/* ---- Bố cục điện thoại: bản đồ toàn màn hình + menu kéo ở dưới ---- */
@media (max-width:760px){
  .app{display:block}
  .mapwrap{position:fixed;inset:0}
  .mapbtns{position:fixed}
  .side{position:fixed;left:0;right:0;bottom:0;height:92vh;height:92dvh;border-right:0;border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.28);z-index:1000;transform:translateY(var(--y,60%));transition:transform .26s cubic-bezier(.2,.8,.2,1);overflow:hidden}
  .side.drag{transition:none}
  .sheetHead{touch-action:none;cursor:grab;padding:6px 14px 8px;user-select:none;-webkit-user-select:none}
  .grip{display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 8px}
  .mini{display:block}
  body.picking .side{display:none}
}
body.picking .mapbtns{bottom:150px}

h1{font-size:18px;margin:0;font-weight:700}
.head{display:flex;align-items:center;gap:8px;justify-content:space-between}
.headsub{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px}
.mini{font-size:12.5px;color:var(--mute);text-align:right}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 11px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:5px;line-height:1.2}
button:hover,.btn:hover{border-color:var(--main)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--main);outline-offset:2px}
.pri{background:var(--main);color:#fff;border-color:var(--main)}
.pri:hover{background:var(--main-d)}
input,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
label{display:block;font-size:12.5px;color:var(--mute);margin:8px 0 3px}
.chip{font-size:12.5px;padding:5px 10px;border-radius:20px;background:var(--soft);color:var(--main-d);border:0}
.chip.off{background:#fde8e6;color:var(--danger)}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:6px 0 12px}
.tools button{padding:10px 6px;font-size:13.5px}
.sum{background:var(--soft);border-radius:12px;padding:11px 12px;line-height:1.55}
.bar{height:6px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0}
details{margin:14px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
summary{cursor:pointer;font-weight:600}
.rowb{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.rowb>*{flex:1 1 auto}
h2{font-size:14px;margin:16px 0 8px}
.card{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:9px;scroll-margin:70px}
.card.next{border-color:var(--main);box-shadow:0 0 0 2px var(--soft)}
.card.done{opacity:.62}
.card.near{border-color:var(--lit);box-shadow:0 0 0 3px rgba(245,158,11,.3)}
.num{flex:0 0 30px;height:30px;border-radius:50%;background:var(--main);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.done .num{background:var(--ok)}
.info{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dist{font-size:12.5px;color:var(--mute);white-space:nowrap}
.near .dist{color:var(--lit);font-weight:600}
.sub{color:var(--mute);font-size:13px;margin-top:2px}
.sub a{color:var(--main-d)}
.eta{color:var(--main-d);font-size:13px;margin-top:3px;font-weight:500}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.acts button{padding:7px 10px;font-size:13px}
.acts .arr{border-color:var(--ok);color:var(--ok);font-weight:600}
.acts .arr.lit{background:var(--lit);border-color:var(--lit);color:var(--litink);animation:glow 1.3s ease-in-out infinite}
.acts .gm{background:var(--main);border-color:var(--main);color:#fff}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.7)}50%{box-shadow:0 0 0 8px rgba(245,158,11,0)}}
@media (prefers-reduced-motion:reduce){.acts .arr.lit{animation:none}.side{transition:none}}
.leg{margin:-3px 0 8px 14px;padding:9px 11px 10px 14px;border-left:3px dashed var(--main);background:var(--soft);border-radius:0 12px 12px 0}
.leg.done{border-left-color:var(--ok);opacity:.75}
.leg.near{border-left-color:var(--lit);box-shadow:0 0 0 3px rgba(245,158,11,.35)}
.ltitle{font-weight:600;font-size:13.5px;line-height:1.4}
.lmeta{color:var(--main-d);font-size:13px;margin-top:3px}
.pin{width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--main);border:2px solid #fff;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.pin span{transform:rotate(45deg);color:#fff;font-weight:700;font-size:12px}
.pin.done{background:#2b8a57}.pin.tmp{background:#c2410c}
.me{width:16px;height:16px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 5px rgba(37,99,235,.3)}
.mapbtns button{width:44px;height:44px;border-radius:50%;padding:0;font-size:19px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.leaflet-top{padding-top:env(safe-area-inset-top,0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:2000}
.modal.show{display:flex}
.modal .in{background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0));width:100%;max-width:520px;max-height:92vh;overflow:auto}
@media (min-width:761px){.modal{align-items:center}.modal .in{border-radius:18px}}
.res{border:1px solid var(--line);border-radius:10px;margin-top:6px;max-height:210px;overflow:auto}
.res div{padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px;line-height:1.4}
.res div:last-child{border-bottom:0}
.res div:hover{background:var(--soft)}
.res small{display:block;color:var(--main-d);margin-top:2px}
.banner{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0));width:min(560px,calc(100% - 20px));z-index:2600;background:var(--lit);color:var(--litink);border-radius:14px;padding:13px 44px 13px 14px;box-shadow:0 8px 28px rgba(0,0,0,.35);display:none}
.banner.show{display:block}
.banner .x{position:absolute;top:6px;right:6px;width:36px;height:36px;padding:0;border:0;background:transparent;color:inherit;font-size:24px;line-height:1}
.banner button.go{margin-top:9px;background:#3a2500;color:#fff;border-color:#3a2500;font-weight:600}
.pickbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0));width:min(560px,calc(100% - 20px));z-index:2500;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 8px 28px rgba(0,0,0,.35);display:none}
.pickbar.show{display:block}
.pickbar b{display:block;font-size:14px;line-height:1.4}
.pickbar .sub{margin-top:3px}
.pickbar .rowb{margin-top:10px}
.pickbar .rowb .pri{flex:2}
body.picking .leaflet-container{cursor:crosshair}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 15px;border-radius:22px;z-index:3000;display:none;max-width:92%;text-align:center}
.note{font-size:12.5px;color:var(--mute);margin-top:8px;line-height:1.5}
.warn{background:#fff4e0;color:#6b4300;border-radius:10px;padding:9px 11px;font-size:13px;margin-top:10px;line-height:1.5}
@media (prefers-color-scheme:dark){.warn{background:#3b2c10;color:#f6d79a}.chip.off{background:#3b1a17}}
</style>
</head>
<body>
<div class="banner" id="banner" role="alert">
  <button class="x" id="bnX" aria-label="Đóng">×</button>
  <b id="bnTitle"></b>
  <div id="bnSub" style="font-size:13.5px;margin-top:2px"></div>
  <button class="go" id="bnGo">✔ Xác nhận đã đến</button>
</div>

<div class="app">
<div class="side" id="sheet">
  <div class="sheetHead" id="sheetHead">
    <div class="grip"></div>
    <div class="head">
      <h1>Lộ trình thăm khám</h1>
      <button class="pri" id="bAdd">＋ Thêm</button>
    </div>
    <div class="headsub">
      <button class="chip off" id="gps">Đang xin quyền vị trí…</button>
      <div class="mini" id="mini"></div>
    </div>
  </div>
  <div class="sheetBody">
    <div class="tools">
      <button id="bOpt" class="pri">⚡ Tự sắp xếp</button>
      <button id="bShare">🔗 Chia sẻ</button>
    </div>
    <div class="sum" id="sum">Bấm ＋ Thêm để nhập bệnh nhân đầu tiên.</div>
    <h2>Danh sách điểm thăm</h2>
    <div id="list"></div>
    <details>
      <summary>Dữ liệu và công cụ</summary>
      <div class="rowb"><button id="bCalc">Tính lại lộ trình</button><button id="bExport">Xuất file</button><button id="bImport">Nhập file</button></div>
      <div class="rowb"><button id="bReset">Bắt đầu ngày mới (đặt lại trạng thái)</button></div>
      <label style="display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:14px;margin-top:12px"><input type="checkbox" id="manualArr" style="width:auto;margin-top:3px"><span>Cho phép bấm “Đã đến” thủ công (dùng khi GPS yếu hoặc ghim lệch quá 10 m)</span></label>
      <input type="file" id="fileIn" accept=".json" hidden>
    </details>
  </div>
</div>
<div class="mapwrap">
  <div id="map"></div>
  <div class="mapbtns" id="mapbtns">
    <button id="bMe" aria-label="Về vị trí của tôi" title="Vị trí của tôi">📍</button>
    <button id="bFit" aria-label="Xem tất cả điểm" title="Xem tất cả điểm">⤢</button>
  </div>
</div>
</div>

<!-- Form thêm / sửa -->
<div class="modal" id="formModal"><div class="in">
  <b id="formTitle" style="font-size:16px">Thêm bệnh nhân</b>
  <label>Họ tên *</label><input id="fName" placeholder="Nguyễn Văn A" autocomplete="off">
  <label>Số điện thoại</label><input id="fPhone" inputmode="tel" autocomplete="off">
  <label>Địa chỉ</label>
  <div style="display:flex;gap:6px"><input id="fAddr" placeholder="Số nhà, đường, phường…" autocomplete="off"><button id="bSearch">Tìm</button></div>
  <div class="res" id="res" hidden></div>
  <div class="rowb"><button id="bPin">🗺 Xem / ghim trên bản đồ</button><button id="bHere">📍 Vị trí hiện tại</button></div>
  <label>Hoặc dán toạ độ / link Google Maps</label>
  <div style="display:flex;gap:6px"><input id="fPaste" placeholder="10.7769, 106.7009" autocomplete="off"><button id="bPaste">Xem</button></div>
  <div class="note" id="locInfo">Chưa chọn vị trí</div>
  <label>Ghi chú</label><textarea id="fNote" rows="2"></textarea>
  <div class="rowb"><button class="pri" id="bSave">Lưu</button><button id="bCancel">Đóng</button></div>
</div></div>

<!-- Hộp thoại chung -->
<div class="modal" id="dlg"><div class="in" id="dlgBody"></div></div>

<!-- Thanh xác nhận vị trí trên bản đồ -->
<div class="pickbar" id="pickbar">
  <b id="pkText"></b><div class="sub" id="pkSub"></div>
  <div class="rowb"><button class="pri" id="pkOk">✔ Dùng vị trí này</button><button id="pkCancel">Quay lại</button></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
var KEY='lotrinh_tham_kham_v1', ARRIVE_M=10, ASK_GAP=5*60*1000;
var S=load(), me=null, accuracy=null, watchId=null, wl=null;
var draft=null, editId=null, pick=null;
var etas={}, lastCalc={t:0,pos:null}, routeLine=null, tmpMarker=null, markers={}, meMarker=null, bannerFor=null, centeredOnMe=false;
var $=function(i){return document.getElementById(i)};

function load(){try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&d.patients)return d}catch(e){}return{patients:[]}}
function strip(k,v){return k.charAt(0)==='_'?undefined:v}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S,strip))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none'},3600)}
function pending(){return S.patients.filter(function(p){return p.status!=='done'})}
function fmtT(d){return d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}
function fmtDur(s){var m=Math.max(1,Math.round(s/60));if(m<60)return m+' phút';return Math.floor(m/60)+' giờ'+(m%60?' '+m%60+' phút':'')}
function fmtDist(d){return d<1000?Math.round(d)+' m':(d/1000).toFixed(1)+' km'}
function hav(a,b){var R=6371000,r=Math.PI/180,dl=(b.lat-a.lat)*r,dg=(b.lng-a.lng)*r;var x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dg/2)*Math.sin(dg/2);return 2*R*Math.asin(Math.sqrt(x))}
function radius(){return ARRIVE_M}
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t).then(function(){toast('Đã sao chép link')}).catch(fb);
  fb();
  function fb(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Đã sao chép link')}catch(e){toast('Không sao chép được')}a.remove()}
}
function dlg(html){$('dlgBody').innerHTML=html;$('dlg').classList.add('show')}
function closeDlg(){$('dlg').classList.remove('show')}
$('dlg').addEventListener('click',function(e){if(e.target===$('dlg'))closeDlg()});

/* ---------- Menu kéo ở dưới (điện thoại) ---------- */
var sheet=$('sheet'),head=$('sheetHead'),sheetState='half',sheetVis=0,dragS=null;
function isMobile(){return window.matchMedia('(max-width:760px)').matches}
function visFor(st){var H=sheet.offsetHeight;if(st==='peek')return head.offsetHeight+6;if(st==='half')return Math.min(H,Math.round(window.innerHeight*0.5));return H}
function setSheet(st,instant){
  if(!isMobile()){sheet.style.removeProperty('--y');sheetVis=0;$('mapbtns').style.display='';document.documentElement.style.removeProperty('--mb');return}
  sheetState=st;
  var H=sheet.offsetHeight,v=Math.min(visFor(st),H);sheetVis=v;
  sheet.classList.toggle('drag',!!instant);
  sheet.style.setProperty('--y',(H-v)+'px');
  document.documentElement.style.setProperty('--mb',(v+14)+'px');
  $('mapbtns').style.display=st==='full'?'none':'';
}
head.addEventListener('pointerdown',function(e){
  if(!isMobile()||e.target.closest('button'))return;
  dragS={y0:e.clientY,v0:parseFloat(sheet.style.getPropertyValue('--y'))||0,H:sheet.offsetHeight,moved:false,y:null};
  try{head.setPointerCapture(e.pointerId)}catch(x){}
  sheet.classList.add('drag');
});
head.addEventListener('pointermove',function(e){
  if(!dragS)return;
  var dy=e.clientY-dragS.y0;if(Math.abs(dy)>6)dragS.moved=true;
  var maxY=dragS.H-(head.offsetHeight+6);
  dragS.y=Math.max(0,Math.min(maxY,dragS.v0+dy));
  sheet.style.setProperty('--y',dragS.y+'px');
});
function endDrag(){
  if(!dragS)return;
  var d=dragS;dragS=null;sheet.classList.remove('drag');
  if(!d.moved){setSheet(sheetState==='peek'?'half':(sheetState==='half'?'full':'peek'));return}
  var vis=d.H-(d.y!=null?d.y:d.v0),best='peek',bd=1e9;
  ['peek','half','full'].forEach(function(s){var dd=Math.abs(visFor(s)-vis);if(dd<bd){bd=dd;best=s}});
  setSheet(best);
}
head.addEventListener('pointerup',endDrag);
head.addEventListener('pointercancel',endDrag);
window.addEventListener('resize',function(){setSheet(sheetState,true);map.invalidateSize()});

/* ---------- Bản đồ ---------- */
var map=L.map('map',{attributionControl:false}).setView([10.7769,106.7009],12);
L.control.attribution({position:'topright',prefix:false}).addTo(map);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
function bottomInset(){return pick&&isMobile()?150:(isMobile()?sheetVis:0)}
function centerOn(lat,lng,zoom){
  map.setView([lat,lng],zoom,{animate:false});
  var b=bottomInset();if(b)map.panBy([0,b/2],{animate:false});
}
function numIcon(n,cls){return L.divIcon({className:'',html:'<div class="pin '+(cls||'')+'"><span>'+n+'</span></div>',iconSize:[28,28],iconAnchor:[14,28]})}
function popupHtml(p){return '<b>'+esc(p.name)+'</b><br>'+esc(p.addr||p._rev||(p._rev===undefined?'Đang tìm địa chỉ…':''))+(p.phone?'<br>'+esc(p.phone):'')+'<br><small>'+p.lat.toFixed(5)+', '+p.lng.toFixed(5)+'</small>'}
function drawMarkers(){
  Object.keys(markers).forEach(function(k){map.removeLayer(markers[k])});markers={};
  S.patients.forEach(function(p,i){
    var d=p.status==='done';
    var m=L.marker([p.lat,p.lng],{icon:numIcon(d?'✓':i+1,d?'done':'')}).addTo(map);
    m.bindPopup(popupHtml(p));
    m.on('popupopen',function(){
      if(p.addr||p._rev!==undefined)return;
      reverse(p.lat,p.lng).then(function(a){p._rev=a||'';m.setPopupContent(popupHtml(p))});
    });
    m.on('click',function(){
      if(isMobile()&&sheetState==='peek')setSheet('half');
      var c=document.querySelector('.card[data-id="'+p.id+'"]');if(c)c.scrollIntoView({block:'center',behavior:'smooth'})
    });
    markers[p.id]=m;
  });
}
function drawMe(){
  if(!me)return;
  if(!meMarker)meMarker=L.marker([me.lat,me.lng],{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[16,16]}),zIndexOffset:1000}).addTo(map);
  else meMarker.setLatLng([me.lat,me.lng]);
}
function fitAll(){
  var pts=pending().map(function(p){return[p.lat,p.lng]});if(me)pts.push([me.lat,me.lng]);
  var b=bottomInset();
  if(pts.length>1)map.fitBounds(pts,{paddingTopLeft:[40,60],paddingBottomRight:[40,b+30],maxZoom:16});
  else if(pts.length===1)centerOn(pts[0][0],pts[0][1],16);
}
$('bMe').onclick=function(){if(me)centerOn(me.lat,me.lng,16);else startGps()};
$('bFit').onclick=fitAll;

/* ---------- Chọn vị trí: xem trên bản đồ trước khi dùng ---------- */
function setDraft(lat,lng,label){
  draft={lat:lat,lng:lng};
  $('locInfo').textContent='✔ '+label+' ('+lat.toFixed(5)+', '+lng.toFixed(5)+')';
}
function syncDraftMarker(){
  if(tmpMarker){map.removeLayer(tmpMarker);tmpMarker=null}
  if(draft)tmpMarker=L.marker([draft.lat,draft.lng],{icon:numIcon('+','tmp')}).addTo(map);
}
function startPick(cand){
  pick={cand:null};
  hideForm();document.body.classList.add('picking');$('pickbar').classList.add('show');
  if(tmpMarker){map.removeLayer(tmpMarker);tmpMarker=null}
  if(cand)setCand(cand.lat,cand.lng,cand.label,true,cand.addr);
  else{updatePickBar();if(me)centerOn(me.lat,me.lng,16)}
}
var revCache={},revTok=0;
function reverse(lat,lng){
  var k=lat.toFixed(5)+','+lng.toFixed(5);
  if(revCache[k]!==undefined)return Promise.resolve(revCache[k]);
  return fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&accept-language=vi&lat='+lat+'&lon='+lng)
   .then(function(r){return r.json()}).then(function(d){
     if(!d||d.error)return '';
     var a=d.address||{},road=a.road||a.pedestrian||a.footway||'';
     var parts=[[a.house_number,road].filter(Boolean).join(' '),a.quarter||a.suburb||a.neighbourhood||a.village||'',a.city_district||a.county||a.district||'',a.city||a.town||a.state||''].filter(Boolean);
     var r2=parts.length?parts.join(', '):(d.display_name||'');
     revCache[k]=r2;return r2;
   }).catch(function(){return ''});
}
function setCand(lat,lng,label,center,addr){
  pick.cand={lat:lat,lng:lng,label:label,addr:addr};
  if(tmpMarker)map.removeLayer(tmpMarker);
  tmpMarker=L.marker([lat,lng],{icon:numIcon('+','tmp'),draggable:true}).addTo(map);
  tmpMarker.bindPopup(function(){var c=pick&&pick.cand;return c?'<b>'+esc(c.addr===undefined?'Đang tìm địa chỉ…':(c.addr||c.label))+'</b><br><small>'+c.lat.toFixed(5)+', '+c.lng.toFixed(5)+'</small>':''});
  tmpMarker.on('dragend',function(){var p=tmpMarker.getLatLng();setCand(p.lat,p.lng,'Vị trí đã kéo chỉnh',false)});
  if(center)centerOn(lat,lng,Math.max(map.getZoom(),17));
  updatePickBar();
  var tok=++revTok;
  if(addr===undefined){
    reverse(lat,lng).then(function(a){
      if(tok!==revTok||!pick||!pick.cand)return;
      pick.cand.addr=a;updatePickBar();
      try{if(tmpMarker&&tmpMarker.isPopupOpen())tmpMarker.getPopup().update()}catch(e){}
    });
  }
}
function updatePickBar(){
  var c=pick&&pick.cand;
  $('pkText').textContent=c?(c.addr===undefined?'Đang tìm địa chỉ…':(c.addr||c.label)):'Chạm vào bản đồ để ghim vị trí';
  $('pkSub').textContent=c?(c.lat.toFixed(5)+', '+c.lng.toFixed(5)+' · Chạm bản đồ hoặc kéo ghim để chỉnh. Địa chỉ lấy từ OpenStreetMap, hẻm nhỏ có thể chỉ hiện tên đường hoặc phường.'):'Phóng to bản đồ để ghim chính xác hơn.';
  $('pkOk').disabled=!c;
}
function endPick(){pick=null;document.body.classList.remove('picking');$('pickbar').classList.remove('show');syncDraftMarker()}
map.on('click',function(e){if(pick)setCand(e.latlng.lat,e.latlng.lng,'Vị trí đã chọn trên bản đồ',false)});
$('pkOk').onclick=function(){
  if(!pick||!pick.cand)return;
  var c=pick.cand,txt=c.addr||c.label;
  setDraft(c.lat,c.lng,txt.length>70?txt.slice(0,70)+'…':txt);
  if(!$('fAddr').value.trim()&&c.addr)$('fAddr').value=c.addr;
  endPick();showForm();
};
$('pkCancel').onclick=function(){endPick();showForm()};

/* ---------- Tìm địa chỉ / toạ độ ---------- */
function geocode(){
  var q=$('fAddr').value.trim();if(!q){toast('Nhập địa chỉ cần tìm');return}
  var box=$('res');box.hidden=false;box.innerHTML='<div>Đang tìm…</div>';
  fetch('https://nominatim.openstreetmap.org/search?format=json&limit=6&countrycodes=vn&accept-language=vi&q='+encodeURIComponent(q))
   .then(function(r){return r.json()}).then(function(a){
     if(!a.length){box.innerHTML='<div>Không tìm thấy. Thử bớt chữ (ví dụ chỉ tên đường + phường) hoặc ghim trên bản đồ.</div>';return}
     box.innerHTML='';
     a.forEach(function(x){
       var d=document.createElement('div');
       d.innerHTML=esc(x.display_name)+'<small>Chạm để xem trên bản đồ ›</small>';
       d.onclick=function(){startPick({lat:+x.lat,lng:+x.lon,label:x.display_name,addr:x.display_name})};
       box.appendChild(d);
     });
   }).catch(function(){box.innerHTML='<div>Không tìm được (mất mạng?). Hãy ghim trên bản đồ.</div>'});
}
function parseCoords(s){
  try{s=decodeURIComponent(s.trim())}catch(e){s=s.trim()}
  var m=s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||s.match(/[?&](?:q|query|ll|destination)=(-?\d+\.\d+)[, ]+(-?\d+\.\d+)/)||s.match(/^(-?\d+\.\d+)\s*[, ]\s*(-?\d+\.\d+)$/);
  if(!m)return null;
  var a=+m[1],b=+m[2];
  if(Math.abs(a)>90||Math.abs(b)>180)return null;
  return{lat:a,lng:b};
}

/* ---------- Form ---------- */
function showForm(){$('formModal').classList.add('show')}
function hideForm(){$('formModal').classList.remove('show')}
function resetForm(){editId=null;draft=null;['fName','fPhone','fAddr','fNote','fPaste'].forEach(function(i){$(i).value=''});$('locInfo').textContent='Chưa chọn vị trí';$('res').hidden=true;$('res').innerHTML='';$('formTitle').textContent='Thêm bệnh nhân';syncDraftMarker()}
function closeForm(){hideForm();resetForm()}
function savePatient(){
  var name=$('fName').value.trim();
  if(!name){toast('Cần nhập họ tên');return}
  if(!draft){toast('Cần chọn vị trí: tìm địa chỉ, ghim trên bản đồ hoặc dán toạ độ');return}
  if(editId){var p=S.patients.filter(function(x){return x.id===editId})[0];p.name=name;p.phone=$('fPhone').value.trim();p.addr=$('fAddr').value.trim();p.note=$('fNote').value.trim();p.lat=draft.lat;p.lng=draft.lng}
  else S.patients.push({id:'p'+Date.now(),name:name,phone:$('fPhone').value.trim(),addr:$('fAddr').value.trim(),note:$('fNote').value.trim(),lat:draft.lat,lng:draft.lng,status:'pending'});
  save();closeForm();refresh(false);
}
function editPatient(id){
  var p=S.patients.filter(function(x){return x.id===id})[0];if(!p)return;
  resetForm();editId=id;$('fName').value=p.name;$('fPhone').value=p.phone||'';$('fAddr').value=p.addr||'';$('fNote').value=p.note||'';
  setDraft(p.lat,p.lng,'Vị trí hiện có');$('formTitle').textContent='Sửa bệnh nhân';showForm();
}
function move(id,dir){
  var pend=pending(),i=pend.findIndex(function(p){return p.id===id}),j=i+dir;
  if(j<0||j>=pend.length)return;
  var ia=S.patients.indexOf(pend[i]),ib=S.patients.indexOf(pend[j]);
  var t=S.patients[ia];S.patients[ia]=S.patients[ib];S.patients[ib]=t;
  save();refresh(false);
}
function moveToNext(id){
  var i=S.patients.findIndex(function(p){return p.id===id});if(i<0)return;
  var p=S.patients.splice(i,1)[0];
  var j=S.patients.findIndex(function(x){return x.status!=='done'});
  if(j<0)j=S.patients.length;
  S.patients.splice(j,0,p);save();refresh(false);toast('Đã chuyển '+p.name+' lên điểm kế tiếp');
}
function markArrived(id){
  var p=S.patients.filter(function(x){return x.id===id})[0];if(!p||p.status==='done')return;
  if(!S.manualArrive&&!(me&&hav(me,p)<=ARRIVE_M)){toast('Cần đến trong phạm vi '+ARRIVE_M+' m của điểm này mới xác nhận được');return}
  p.status='done';p.arrivedAt=Date.now();
  hideBanner();
  if(!me||hav(me,p)>300){me={lat:p.lat,lng:p.lng};drawMe()}
  save();refresh(false);
  var n=pending()[0];toast(n?'Đã đến '+p.name+'. Điểm tiếp theo: '+n.name:'Đã thăm hết các điểm 🎉');
}

/* ---------- Định tuyến (chỉ tính quãng đường và thời gian di chuyển) ---------- */
function osrm(path){return fetch('https://router.project-osrm.org/'+path).then(function(r){if(!r.ok)throw 0;return r.json()})}
function coordStr(a){return a.map(function(p){return p.lng.toFixed(6)+','+p.lat.toFixed(6)}).join(';')}
function nearestOrder(start,list){
  var rest=list.slice(),cur=start,out=[];
  while(rest.length){var bi=0,bd=1e18;rest.forEach(function(p,i){var d=hav(cur,p);if(d<bd){bd=d;bi=i}});cur=rest.splice(bi,1)[0];out.push(cur)}
  return out;
}
function applyOrder(np){S.patients=S.patients.filter(function(p){return p.status==='done'}).concat(np);save()}
function optimize(){
  var pend=pending();
  if(pend.length<2){toast('Cần ít nhất 2 điểm để sắp xếp');return}
  var pts=me?[me].concat(pend):pend.slice();
  toast('Đang sắp xếp…');
  function fallback(){applyOrder(me?nearestOrder(me,pend):[pend[0]].concat(nearestOrder(pend[0],pend.slice(1))));refresh(false);toast('Không gọi được máy chủ đường đi — đã xếp theo khoảng cách gần nhất')}
  if(pts.length>90){fallback();return}
  osrm('trip/v1/driving/'+coordStr(pts)+'?source=first&roundtrip=false&overview=false').then(function(d){
    if(!d.waypoints)throw 0;
    var idx=d.waypoints.map(function(w,i){return{i:i,o:w.waypoint_index}}).sort(function(a,b){return a.o-b.o});
    var order=idx.map(function(x){return pts[x.i]}).filter(function(p){return p.id});
    applyOrder(order);refresh(false);toast('Đã sắp xếp lộ trình ngắn nhất');
  }).catch(fallback);
}
function calcRoute(){
  var pend=pending();
  if(routeLine){map.removeLayer(routeLine);routeLine=null}
  etas={};
  if(!pend.length){renderSummary(null);renderList();return Promise.resolve()}
  var pts=me?[me].concat(pend):pend.slice();
  function finish(legs,legD,geo,approx){
    var move=0,dist=0;
    pend.forEach(function(p,i){
      var k=me?i:i-1,leg=k>=0?legs[k]:0,ld=k>=0?legD[k]:0;
      etas[p.id]={leg:leg,legD:ld};move+=leg;dist+=ld;
    });
    lastCalc={t:Date.now(),pos:me?{lat:me.lat,lng:me.lng}:null};
    routeLine=L.polyline(geo,{color:'#0b6b5f',weight:5,opacity:.8,dashArray:approx?'8,8':null}).addTo(map);
    renderSummary({n:pend.length,dist:dist,move:move,approx:approx});
    renderList();
  }
  function fallback(){
    var legs=[],legD=[],geo=pts.map(function(p){return[p.lat,p.lng]});
    for(var i=1;i<pts.length;i++){var d=hav(pts[i-1],pts[i])*1.35;legs.push(d/(22000/3600));legD.push(d)}
    finish(legs,legD,geo,true);
  }
  if(pts.length<2){etas[pend[0].id]={leg:0,legD:0};renderSummary({n:1,dist:0,move:0});renderList();return Promise.resolve()}
  return osrm('route/v1/driving/'+coordStr(pts)+'?overview=full&geometries=geojson').then(function(d){
    var r=d.routes[0];
    finish(r.legs.map(function(l){return l.duration}),r.legs.map(function(l){return l.distance}),r.geometry.coordinates.map(function(c){return[c[1],c[0]]}),false);
  }).catch(fallback);
}

/* ---------- Hiển thị ---------- */
function renderSummary(s){
  var total=S.patients.length,dn=total-pending().length;
  var prog='<div class="bar"><i style="width:'+(total?Math.round(dn/total*100):0)+'%"></i></div>';
  if(!total){$('sum').textContent='Bấm ＋ Thêm để nhập bệnh nhân đầu tiên.';$('mini').textContent='Chưa có điểm nào';return}
  if(!s){$('sum').innerHTML='<b>Đã thăm hết '+total+' điểm 🎉</b>'+prog;$('mini').textContent='Đã thăm hết '+total+' điểm';return}
  $('sum').innerHTML='<b>Đã thăm '+dn+'/'+total+'</b> · còn '+s.n+' điểm<br>Di chuyển còn lại: <b>'+(s.dist/1000).toFixed(1)+' km</b> · khoảng <b>'+fmtDur(s.move)+'</b>'+(s.approx?'<br><small>Ước tính theo đường chim bay (chưa lấy được đường thực tế).</small>':'')+prog;
  $('mini').textContent='Còn '+s.n+' điểm · '+(s.dist/1000).toFixed(1)+' km · '+fmtDur(s.move);
}
function moveToNextLabel(){return '⇧ Thăm trước'}
function arrBtn(id){return '<button class="arr" data-act="arr" data-id="'+id+'"'+(S.manualArrive?'':' disabled')+'>✔ Đã đến</button>'}
function renderList(){
  var nextId=(pending()[0]||{}).id,h='';
  S.patients.forEach(function(p,i){
    var dn=p.status==='done',e=etas[p.id],id=p.id;
    if(i>0){
      var prev=S.patients[i-1];
      h+='<div class="leg'+(dn?' done':'')+'" data-id="'+id+'"><div class="ltitle">Chuyến '+i+' · '+esc(prev.name)+' → '+esc(p.name)+'</div>';
      if(dn){
        h+='<div class="lmeta">✓ Đã đến lúc '+(p.arrivedAt?fmtT(new Date(p.arrivedAt)):'')+'</div><div class="acts"><button data-act="undo" data-id="'+id+'">Hoàn tác</button></div>';
      }else{
        var fromMe=id===nextId&&me&&prev.status==='done';
        h+='<div class="lmeta">'+(e&&e.legD?'🛵 '+fmtDist(e.legD)+' · '+fmtDur(e.leg)+(fromMe?' (từ vị trí hiện tại)':''):'')+'</div>'
         +'<div class="acts"><button class="gm" data-act="route" data-id="'+id+'">🧭 Đường đi</button>'+arrBtn(id)+'</div>';
      }
      h+='</div>';
    }
    h+='<div class="card'+(dn?' done':'')+(id===nextId?' next':'')+'" data-id="'+id+'"><div class="num">'+(dn?'✓':i+1)+'</div><div class="info">'
     +'<div class="top"><b>'+esc(p.name)+'</b><span class="dist"></span></div>'
     +'<div class="sub">'+(p.phone?'<a href="tel:'+esc(p.phone)+'">'+esc(p.phone)+'</a> · ':'')+esc(p.addr||'(vị trí ghim)')+'</div>'
     +(p.note?'<div class="sub">📝 '+esc(p.note)+'</div>':'')
     +(i===0&&!dn&&e&&e.legD?'<div class="eta">🛵 '+fmtDist(e.legD)+' · '+fmtDur(e.leg)+' từ vị trí của bạn</div>':'')
     +(i===0&&dn?'<div class="eta">Đã đến lúc '+(p.arrivedAt?fmtT(new Date(p.arrivedAt)):'')+'</div>':'')
     +'<div class="acts">';
    if(i===0){
      h+=dn?'<button data-act="undo" data-id="'+id+'">Hoàn tác</button>':'<button class="gm" data-act="route" data-id="'+id+'">🧭 Đường đi</button>'+arrBtn(id)+'';
    }
    if(!dn){
      h+='<button data-act="up" data-id="'+id+'" aria-label="Lên">▲</button><button data-act="dn" data-id="'+id+'" aria-label="Xuống">▼</button>';
      if(id!==nextId)h+='<button data-act="next" data-id="'+id+'">⇧ Thăm trước</button>';
    }
    h+='<button data-act="focus" data-id="'+id+'">Xem</button><button data-act="edit" data-id="'+id+'">Sửa</button><button data-act="del" data-id="'+id+'">Xoá</button></div></div></div>';
  });
  $('list').innerHTML=h||'<div class="sub">Chưa có điểm nào.</div>';
  updateLive();
}
function legUrl(p){
  var i=S.patients.indexOf(p),prev=i>0?S.patients[i-1]:null;
  var u='https://www.google.com/maps/dir/?api=1&travelmode=two-wheeler&destination='+p.lat+','+p.lng;
  if(prev&&prev.status!=='done')u+='&origin='+prev.lat+','+prev.lng;
  return u;
}
$('list').addEventListener('click',function(e){
  var b=e.target.closest('button[data-act]');if(!b)return;
  var id=b.getAttribute('data-id'),a=b.getAttribute('data-act');
  var p=S.patients.filter(function(x){return x.id===id})[0];if(!p)return;
  if(a==='arr')markArrived(id);
  else if(a==='route')window.open(legUrl(p),'_blank','noopener');
  else if(a==='up')move(id,-1);
  else if(a==='dn')move(id,1);
  else if(a==='next')moveToNext(id);
  else if(a==='edit')editPatient(id);
  else if(a==='focus'){
    if(isMobile())setSheet('peek');
    centerOn(p.lat,p.lng,17);if(markers[id])markers[id].openPopup();
  }
  else if(a==='undo'){p.status='pending';delete p.arrivedAt;save();refresh(false)}
  else if(a==='del'){if(confirm('Xoá '+p.name+'?')){S.patients=S.patients.filter(function(x){return x.id!==id});save();refresh(false)}}
});
function refresh(fit){drawMarkers();renderList();calcRoute();if(fit)setTimeout(fitAll,50)}

/* ---------- GPS + phát hiện đã đến ---------- */
function setGpsChip(txt,off){var c=$('gps');c.textContent=txt;c.classList.toggle('off',!!off)}
function onPos(pos){
  me={lat:pos.coords.latitude,lng:pos.coords.longitude};accuracy=pos.coords.accuracy;
  setGpsChip('📍 GPS bật · ~'+Math.round(accuracy)+' m',false);
  drawMe();
  if(!centeredOnMe){centeredOnMe=true;if(!pick)centerOn(me.lat,me.lng,16);calcRoute()}
  else if(lastCalc.pos&&hav(lastCalc.pos,me)>200&&Date.now()-lastCalc.t>60000)calcRoute();
  updateLive();
}
function onPosErr(err){
  watchId=null;
  if(err.code===1){setGpsChip('GPS bị chặn · bấm để thử lại',true);toast('Hãy cho phép vị trí cho trang này trong cài đặt trình duyệt')}
  else setGpsChip('Chưa lấy được vị trí · bấm để thử lại',true);
  if(!centeredOnMe)fitAll();
}
function startGps(){
  if(!navigator.geolocation){setGpsChip('Thiết bị không hỗ trợ GPS',true);return}
  if(watchId!==null)return;
  setGpsChip('Đang xin quyền vị trí…',true);
  watchId=navigator.geolocation.watchPosition(onPos,onPosErr,{enableHighAccuracy:true,maximumAge:5000,timeout:25000});
  lockScreen();
}
function lockScreen(){try{if(navigator.wakeLock&&document.visibilityState==='visible')navigator.wakeLock.request('screen').then(function(l){wl=l}).catch(function(){})}catch(e){}}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible'||watchId===null)return;
  lockScreen();
  navigator.geolocation.getCurrentPosition(onPos,function(){},{enableHighAccuracy:true,timeout:15000,maximumAge:0});
});
$('gps').onclick=function(){if(watchId===null)startGps()};

function showBanner(p){
  bannerFor=p.id;
  $('bnTitle').textContent='📍 Bạn đang ở gần '+p.name;
  $('bnSub').textContent='Cách khoảng '+fmtDist(p._d)+(p.addr?' · '+p.addr:'');
  $('bnGo').onclick=function(){markArrived(p.id)};
  $('bnX').onclick=function(){p.askedAt=Date.now();hideBanner();save()};
  $('banner').classList.add('show');
  if(navigator.vibrate)navigator.vibrate([200,100,200]);
}
function hideBanner(){bannerFor=null;$('banner').classList.remove('show')}
function updateLive(){
  var man=!!S.manualArrive;
  if(!me){
    if(!man)document.querySelectorAll('.arr').forEach(function(b){b.disabled=true;b.textContent='Chờ GPS…'});
    return;
  }
  var now=Date.now(),best=null,nearIds={};
  pending().forEach(function(p){
    var d=hav(me,p);p._d=d;
    var near=d<=ARRIVE_M;
    var card=document.querySelector('.card[data-id="'+p.id+'"]');
    if(card){card.querySelector('.dist').textContent='cách '+fmtDist(d);card.classList.toggle('near',near)}
    var leg=document.querySelector('.leg[data-id="'+p.id+'"]');
    if(leg)leg.classList.toggle('near',near);
    document.querySelectorAll('.arr[data-id="'+p.id+'"]').forEach(function(btn){
      var ok=near||man;
      btn.classList.toggle('lit',near);
      btn.disabled=!ok;
      btn.textContent=ok?'✔ Đã đến':'Còn '+fmtDist(d);
      btn.title=near?'':'Cần đến trong phạm vi '+ARRIVE_M+' m';
    });
    if(near){nearIds[p.id]=1;if(!best||d<best._d)best=p}
  });
  if(bannerFor&&!nearIds[bannerFor])hideBanner();
  if(best&&bannerFor!==best.id&&(!best.askedAt||now-best.askedAt>ASK_GAP)&&!$('banner').classList.contains('show'))showBanner(best);
}

/* ---------- Chia sẻ toàn bộ lộ trình ---------- */
function b64e(u8){var s='';for(var i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function pack(str){
  var bytes=new TextEncoder().encode(str);
  if(window.CompressionStream){
    var cs=new CompressionStream('deflate-raw'),w=cs.writable.getWriter();w.write(bytes);w.close();
    return 'z'+b64e(new Uint8Array(await new Response(cs.readable).arrayBuffer()));
  }
  return 'j'+b64e(bytes);
}
async function unpack(s){
  var bytes=b64d(s.slice(1));
  if(s[0]==='z'){var ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(bytes);w.close();bytes=new Uint8Array(await new Response(ds.readable).arrayBuffer())}
  return new TextDecoder().decode(bytes);
}
async function buildShare(){
  var hide=$('shHide').checked,priv=$('shPriv').checked,stat=$('shStat').checked,pend=S.patients;
  var obj={v:1,s:pend.map(function(p,i){return[hide?'Điểm '+(i+1):p.name,+p.lat.toFixed(6),+p.lng.toFixed(6),p.addr||'',priv?(p.phone||''):'',priv?(p.note||''):'',stat&&p.status==='done'?1:0]})};
  return location.href.split('#')[0]+'#r='+await pack(JSON.stringify(obj));
}
function openShare(){
  if(!S.patients.length){toast('Chưa có điểm nào để chia sẻ');return}
  dlg('<b style="font-size:16px">Chia sẻ lộ trình</b>'
   +'<div class="note">Chia sẻ toàn bộ lộ trình ('+S.patients.length+' điểm, đúng thứ tự hiện tại). Người nhận mở link sẽ có danh sách này trong app của họ, với đủ các chuyến, nút đường đi và nút xác nhận đã đến chạy trên máy họ.</div>'
   +'<label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px"><input type="checkbox" id="shPriv" style="width:auto"> Kèm số điện thoại và ghi chú</label>'
   +'<label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px"><input type="checkbox" id="shHide" style="width:auto"> Ẩn họ tên (chỉ ghi “Điểm 1, 2, 3…”)</label>'
   +'<label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px"><input type="checkbox" id="shStat" style="width:auto"> Giữ trạng thái đã thăm (mặc định: người nhận bắt đầu lại từ đầu)</label>'
   +'<div class="warn">Link chứa thông tin bệnh nhân (địa chỉ, và tên nếu không ẩn). Chỉ gửi cho đồng nghiệp qua kênh nội bộ. Dữ liệu nằm trong link, không lưu trên máy chủ nào.</div>'
   +'<div class="rowb"><button class="pri" id="shSend">Chia sẻ…</button><button id="shCopy">Chép link</button><button id="shClose">Đóng</button></div>');
  $('shClose').onclick=closeDlg;
  $('shCopy').onclick=function(){buildShare().then(function(u){if(u.length>8000)toast('Link khá dài ('+u.length+' ký tự), một số ứng dụng chat có thể cắt bớt');copyText(u)})};
  $('shSend').onclick=function(){buildShare().then(function(u){
    if(navigator.share)navigator.share({title:'Lộ trình thăm khám',text:'Lộ trình '+S.patients.length+' điểm',url:u}).catch(function(){});
    else copyText(u);
  })};
}
function checkSharedHash(){
  var m=location.hash.match(/^#r=(.+)$/);if(!m)return;
  unpack(m[1]).then(function(t){
    var o=JSON.parse(t);
    if(!o||!Array.isArray(o.s)||!o.s.length)throw 0;
    o.s.forEach(function(a){if(!isFinite(a[1])||!isFinite(a[2]))throw 0});
    history.replaceState(null,'',location.href.split('#')[0]);
    dlg('<b style="font-size:16px">Nhận lộ trình được chia sẻ</b><div class="note">Có <b>'+o.s.length+' điểm</b> trong link này. Bạn muốn làm gì?</div><div class="rowb"><button class="pri" id="rpl">Thay danh sách hiện tại</button><button id="apd">Thêm vào cuối danh sách</button><button id="cnl">Bỏ qua</button></div>');
    function apply(replace){
      var arr=o.s.map(function(a,i){return{id:'p'+Date.now()+'_'+i,name:a[0],lat:a[1],lng:a[2],addr:a[3]||'',phone:a[4]||'',note:a[5]||'',status:a[6]?'done':'pending'}});
      S.patients=replace?arr:S.patients.concat(arr);
      save();closeDlg();refresh(true);toast('Đã nhận '+arr.length+' điểm');
    }
    $('rpl').onclick=function(){if(!S.patients.length||confirm('Thay toàn bộ danh sách hiện tại?'))apply(true)};
    $('apd').onclick=function(){apply(false)};
    $('cnl').onclick=closeDlg;
  }).catch(function(){toast('Link chia sẻ không hợp lệ hoặc bị cắt mất')});
}

/* ---------- Sao lưu ---------- */
function exportData(){var blob=new Blob([JSON.stringify(S,strip,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lo-trinh-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function importData(f){var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d.patients)throw 0;S=d;save();refresh(true);toast('Đã nhập dữ liệu')}catch(e){toast('File không hợp lệ')}};r.readAsText(f)}

/* ---------- Khởi tạo ---------- */
$('bAdd').onclick=function(){resetForm();showForm()};
$('bCancel').onclick=closeForm;
$('formModal').addEventListener('click',function(e){if(e.target===$('formModal'))closeForm()});
$('bSearch').onclick=geocode;
$('fAddr').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();geocode()}});
$('bPin').onclick=function(){startPick(draft?{lat:draft.lat,lng:draft.lng,label:'Vị trí đang chọn'}:null)};
$('bHere').onclick=function(){
  if(me){startPick({lat:me.lat,lng:me.lng,label:'Vị trí hiện tại của bạn'});return}
  toast('Chưa có vị trí GPS — hãy cho phép vị trí rồi thử lại');startGps();
};
$('bPaste').onclick=function(){var c=parseCoords($('fPaste').value);if(c)startPick({lat:c.lat,lng:c.lng,label:'Toạ độ đã dán'});else toast('Không đọc được toạ độ. Dùng dạng 10.7769, 106.7009 hoặc link Google Maps dài')};
$('bSave').onclick=savePatient;
$('manualArr').checked=!!S.manualArrive;
$('manualArr').onchange=function(){S.manualArrive=this.checked;save();renderList()};
$('bOpt').onclick=optimize;
$('bShare').onclick=openShare;
$('bCalc').onclick=function(){calcRoute().then(function(){toast('Đã tính lại')})};
$('bExport').onclick=exportData;
$('bImport').onclick=function(){$('fileIn').click()};
$('fileIn').onchange=function(){if(this.files[0])importData(this.files[0]);this.value=''};
$('bReset').onclick=function(){if(!confirm('Đưa tất cả bệnh nhân về trạng thái "chưa thăm"?'))return;S.patients.forEach(function(p){p.status='pending';delete p.arrivedAt;delete p.askedAt});save();refresh(false)};

refresh(true);setSheet(S.patients.length?'half':'peek',true);checkSharedHash();startGps();
setTimeout(function(){map.invalidateSize();setSheet(sheetState,true)},300);
})();
</script>
